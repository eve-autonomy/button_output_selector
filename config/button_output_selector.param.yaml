# use_double_button is set by the launch argument.
/**:
  ros__parameters:
    # (double button) Time to wait for the engage judgement after the engage button is released,
    # before forwarding the delivery reservation button [sec]
    decision_grace_sec: 0.3
    # (double button) Maximum time to hold a delivery reservation press while waiting for the
    # judgement [sec]. Should be a little longer than max_press_sec of engage_srv_converter.
    max_wait_sec: 16.0
